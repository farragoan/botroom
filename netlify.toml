[build]
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  # Served as a sub-path app at https://dhruvnagpal.in/botroom (non-secret).
  NEXT_PUBLIC_BASE_PATH = "/botroom"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- API (reached both as /api/* via the dhruvnagpal.in proxy, which strips /botroom,
# --- and as /botroom/api/* when hit directly on the alias) ---
[[redirects]]
  from   = "/botroom/api/debates/:id"
  to     = "/.netlify/functions/debate-detail"
  status = 200

[[redirects]]
  from   = "/botroom/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/api/debates/:id"
  to     = "/.netlify/functions/debate-detail"
  status = 200

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# --- Static pass-through for direct alias hits (must precede the SPA catch-all) ---
[[redirects]]
  from   = "/botroom/assets/*"
  to     = "/assets/:splat"
  status = 200

[[redirects]]
  from   = "/botroom/registerSW.js"
  to     = "/registerSW.js"
  status = 200

[[redirects]]
  from   = "/botroom/sw.js"
  to     = "/sw.js"
  status = 200

[[redirects]]
  from   = "/botroom/icon.svg"
  to     = "/icon.svg"
  status = 200

[[redirects]]
  from   = "/botroom/manifest.webmanifest"
  to     = "/manifest.webmanifest"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
